<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ME2 正答登録</title><link rel="stylesheet" href="style.css"></head><body><header class="top admin"><div><span class="brand">ADMIN TOOL</span><h1>正答・平均を登録する</h1><p>受験者用アプリとは独立した管理者向け画面です。</p></div></header><main><div class="notice">試験名、正答、平均値を登録すると受験者画面へ反映されます。平均値は得点率（%）で入力し、未登録でも構いません。</div><section class="identity"><label>試験名<input id="examName"></label><label>公開バージョン<input id="answerVersion" value="1.0.0"></label><label>総合学内平均得点率（%） <small>未登録なら空欄</small><input id="schoolTotal" type="number" min="0" max="100" step="0.1"></label><label>総合全国平均得点率（%） <small>未登録なら空欄</small><input id="nationalTotal" type="number" min="0" max="100" step="0.1"></label></section><section class="category-average-panel"><h2>分野別平均得点率（%） <small>午前・午後の合算値</small></h2><div id="categoryAverages"></div></section><h2>問題別設定</h2><div id="adminRows"></div><section class="actions"><button id="validate" class="primary">検証して登録</button><label class="button">CSVから入力<input id="importCsv" type="file" accept="text/csv,.csv" hidden></label><button id="exportCsv">CSVを出力</button><button id="exportAnswers">登録済みJSONを出力</button></section><div id="message" aria-live="polite"></div></main><footer><a href="index.html" target="_blank" rel="noopener">受験者画面</a><a href="teacher.html" target="_blank" rel="noopener">教員集計画面</a></footer><script type="module" src="js/admin.js?v=7"></script></body></html>
