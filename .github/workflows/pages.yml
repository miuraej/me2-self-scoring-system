name: Publish student site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare student-only site
        shell: bash
        run: |
          mkdir -p _site/js _site/data/published
          cp index.html style.css result.css _site/
          cp js/core.js js/shared.js js/student.js _site/js/
          cp data/exam.json data/questions.json _site/data/
          cp data/published/ME2_TRIAL_12.json _site/data/published/
          if [ -f data/published/ME2_TRIAL_12.school.json ]; then
            cp data/published/ME2_TRIAL_12.school.json _site/data/published/
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
