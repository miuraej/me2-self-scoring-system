name: Publish student site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare student-only site
        shell: bash
        run: |
          mkdir -p _site/js _site/data/published
          cp index.html style.css result.css _site/
          cp js/core.js js/shared.js js/student.js _site/js/
          cp data/exams.json _site/data/
          cp -R data/exams _site/data/
          find data/published -maxdepth 1 -type f -name '*.json' -exec cp {} _site/data/published/ \;
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
