<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="第2種ME技術実力検定の回答記録と自己採点"><title>ME2 セルフチェック</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="result.css?v=6"></head><body>
<header class="top"><div><span class="brand">ME2 SELF CHECK</span><h1 id="examName">試験名を読み込み中</h1><p>回答を記録する · 問題冊子を見ながら、選んだ番号だけを入力してください。</p></div><div class="privacy">この端末だけに保存</div></header>
<main><section class="exam-picker"><label>試験を選択<select id="examSelect"></select></label></section><section class="status" aria-live="polite"><div><b id="entered">0</b><span>入力済み</span></div><div><b id="missing">0</b><span>未入力</span></div><div><b id="unanswered">0</b><span>未開回答</span></div></section><div id="sectionStatus" class="section-status"></div><div id="missingList" class="subtle"></div>
<section class="identity"><label>学籍番号 <small>任意</small><input id="studentId" autocomplete="off"></label><label>氏名 <small>任意</small><input id="studentName" autocomplete="off"></label></section>
<div id="questions"></div>
<section class="actions"><button id="csv" class="primary">提出用CSVを作成</button><button id="score">採点</button><button id="reset" class="danger">入力をリセット</button></section>
<div id="message" aria-live="polite"></div><div id="result"></div></main>
<footer><span id="version"></span><span>回答・個人情報を外部へ送信しません</span></footer><script type="module" src="js/student.js?v=10"></script></body></html>
